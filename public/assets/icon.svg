<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
<radialGradient id="faceShine" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="70%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#78350F" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Solid Flat Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#F59E0B" />

  <!-- Calibrated Glyph (~19% Optical Margin Sweet-Spot) -->
  <g transform="translate(-30.72 -30.72) scale(1.12)">

<g filter="url(#shadow)">
    <!-- Floating Luminous Smile Sphere -->
    <circle cx="256" cy="260" r="130" fill="url(#faceShine)"/>
    <!-- Specular highlight arc on forehead -->
    <ellipse cx="230" cy="170" rx="60" ry="16" fill="#FFFFFF" fill-opacity="0.55" transform="rotate(-15 230 170)"/>

    <!-- Happy Eyes (Arching smiling crescents ^ ^) -->
    <path d="M 195, 226 C 205, 206 225, 206 235, 226" fill="none" stroke="#78350F" stroke-width="8" stroke-linecap="round"/>
    <path d="M 277, 226 C 287, 206 307, 206 317, 226" fill="none" stroke="#78350F" stroke-width="8" stroke-linecap="round"/>

    <!-- Open Smiling Laughing Mouth (D shape) -->
    <path d="M 195, 260 C 195, 320 317, 320 317, 260 Z" fill="#78350F"/>
    <!-- White Teeth Inset -->
    <path d="M 205, 260 C 205, 280 307, 280 307, 260 Z" fill="#FFFFFF"/>
    <!-- Rosy Tongue -->
    <path d="M 226, 305 C 235, 290 277, 290 286, 305 C 275, 318 237, 318 226, 305 Z" fill="#F43F5E"/>

    <!-- Sparkle Accents (✦) -->
    <path d="M 370, 150 Q 370, 162 382, 162 Q 370, 162 370, 174 Q 370, 162 358, 162 Q 370, 162 370, 150 Z" fill="#FFFFFF"/>
    <path d="M 134, 320 Q 134, 328 142, 328 Q 134, 328 134, 336 Q 134, 328 126, 328 Q 134, 328 134, 320 Z" fill="#FFFBEB" opacity="0.9"/>
  </g>
  </g>

  <!-- 2px Specular Rim Stroke -->
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2" />
</svg>